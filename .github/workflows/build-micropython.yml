name: Build ESP32-C6 MicroPython with TWT Module

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    # Use the stable official Espressif Docker container matching modern MicroPython requirements
    container: espressif/idf:release-v5.4

    steps:
    # 1. Fetch your custom C module repository source code
    - name: Checkout custom module repository
      uses: actions/checkout@v4
      with:
        path: custom_module

    # 2. Install specific dependencies needed inside the Espressif container
    - name: Install build dependencies
      run: |
        apt-get update
        apt-get install -y build-essential libffi-dev git pkg-config python3-pip python3-virtualenv

    # 3. Clone MicroPython and initialize its base submodules manually
    - name: Clone MicroPython core repository
      run: |
        git clone --recursive https://github.com/micropython/micropython.git upstream_micropython
        cd upstream_micropython
        # Initialize only core MicroPython dependencies (skipping external IDF fetches)
        git submodule update --init lib/berkeley-db-1.12 lib/micropython-lib || true

    # 4. Compile the internal MicroPython cross-compiler (mpy-cross)
    - name: Build MicroPython mpy-cross tool
      run: |
        cd upstream_micropython/mpy-cross
        make

    # 5. Dynamically verify and correct the C module path, then compile using release-v5.4
    - name: Compile ESP32-C6 Firmware with Custom TWT Module
      run: |
        # Use the container's built-in activation script to guarantee compiler paths
        . $IDF_PATH/export.sh
        export IDF_COMPONENT_MANAGER=1
        
        # Locate the exact directory containing micropython.cmake
        IFACE_DIR=$(dirname $(find $GITHUB_WORKSPACE/custom_module -name "micropython.cmake" | head -n 1))
        echo "Validated User C Module directory path: $IFACE_DIR"
        
        cd upstream_micropython/ports/esp32
        
        # Build the firmware targeting the custom release-v5.4 container IDF path directly
        make BOARD=ESP32_GENERIC_C6 USER_C_MODULES=$IFACE_DIR ESPIDF=$IDF_PATH

    # 6. Gather and rename the output compiled file
    - name: Prepare build artifacts
      run: |
        mkdir -p build_output
        cp upstream_micropython/ports/esp32/build-ESP32_GENERIC_C6/firmware.bin build_output/micropython-esp32c6-twt.bin

    # 7. Upload the compiled firmware binary to GitHub Actions repository storage
    - name: Upload compiled firmware artifact
      uses: actions/upload-artifact@v4
      with:
        name: micropython-esp32c6-twt-firmware
        path: build_output/micropython-esp32c6-twt.bin
        if-no-files-found: error
        retention-days: 30
