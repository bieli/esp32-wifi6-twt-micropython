name: Build ESP32-C6 MicroPython with TWT Module

# Trigger the workflow on push or pull request to main branches, or via manual dispatch
on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    # 1. Fetch the custom C module source code from the current repository
    - name: Checkout custom module repository
      uses: actions/checkout@v4
      with:
        path: custom_module

    # 2. Install required Linux system dependencies for MicroPython and ESP-IDF
    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential libffi-dev git pkg-config python3-pip python3-virtualenv ccache libssl-dev ninja-build

    # 3. Clone the official MicroPython core repository recursively with all submodules
    - name: Clone MicroPython core repository
      run: |
        git clone --recursive https://github.com/micropython/micropython.git upstream_micropython

    # 4. Compile the internal MicroPython cross-compiler (mpy-cross)
    - name: Build MicroPython mpy-cross tool
      run: |
        cd upstream_micropython/mpy-cross
        make

    # 5. Install the official Espressif toolchain binaries for ESP32-C6
    - name: Install Espressif Toolchain for ESP32-C6
      run: |
        # Since --recursive was used during clone, ESP-IDF is already present in lib/esp-idf
        cd upstream_micropython/lib/esp-idf
        ./install.sh esp32c6

    # 6. Initialize ESP32 port submodules AND compile using the active ESP-IDF environment
    - name: Initialize Submodules and Compile Firmware
      run: |
        # Export toolchain environment variables first so idf.py is accessible
        . upstream_micropython/lib/esp-idf/export.sh
        
        # Now run submodules initialization within the active environment
        cd upstream_micropython/ports/esp32
        make BOARD=ESP32_GENERIC_C6 submodules
        
        # Compile the final image using the USER_C_MODULES parameter
        make BOARD=ESP32_GENERIC_C6 USER_C_MODULES=$GITHUB_WORKSPACE/custom_module/esp32_twt

    # 7. Prepare the compiled output binary for artifact packaging
    - name: Prepare build artifacts
      run: |
        mkdir -p build_output
        cp upstream_micropython/ports/esp32/build-ESP32_GENERIC_C6/firmware.bin build_output/micropython-esp32c6-twt.bin

    # 8. Upload the verified binary file to the GitHub Actions workflow storage
    - name: Upload compiled firmware artifact
      uses: actions/upload-artifact@v4
      with:
        name: micropython-esp32c6-twt-firmware
        path: build_output/micropython-esp32c6-twt.bin
        if-no-files-found: error
        retention-days: 30



