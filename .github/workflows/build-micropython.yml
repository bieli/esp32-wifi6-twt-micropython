name: Build ESP32-C6 MicroPython with TWT Module

# Trigger the workflow on push or pull request to main branches, or via manual dispatch
on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    # Execute all compilation steps inside the official, pre-configured Espressif IDF Docker container
    container: espressif/idf:release-v5.1

    steps:
    # 1. Fetch the custom C module source code from the current repository
    - name: Checkout custom module repository
      uses: actions/checkout@v4
      with:
        path: custom_module

    # 2. Install MicroPython-specific build requirements inside the container
    - name: Install build dependencies
      run: |
        apt-get update
        apt-get install -y build-essential libffi-dev git pkg-config python3-pip python3-virtualenv

    # 3. Clone the official MicroPython core repository (shallow clone for performance)
    - name: Clone MicroPython core repository
      run: |
        git clone --recursive https://github.com/micropython/micropython.git upstream_micropython

    # 4. Compile the internal MicroPython cross-compiler (mpy-cross)
    - name: Build MicroPython mpy-cross tool
      run: |
        cd upstream_micropython/mpy-cross
        make

    # 5. Initialize additional internal target submodules required by the ESP32 port
    - name: Initialize ESP32 port submodules
      run: |
        cd upstream_micropython
        # Initialize critical hardware components mapping, skipping heavy external IDF fetches
        git submodule update --init lib/berkeley-db-1.12 lib/micropython-lib

    # 6. Compile the final firmware binary using the Docker-preinstalled ESP-IDF framework
    - name: Compile ESP32-C6 Firmware with Custom TWT Module
      run: |
        cd upstream_micropython/ports/esp32
        
        # Build the final image passing our custom C module and targeting the custom IDF path
        make BOARD=ESP32_GENERIC_C6 USER_C_MODULES=$GITHUB_WORKSPACE/custom_module/esp32_twt ESPIDF=$IDF_PATH

    # 7. Prepare the compiled output binary for artifact packaging
    - name: Prepare build artifacts
      run: |
        mkdir -p build_output
        cp upstream_micropython/ports/esp32/build-ESP32_GENERIC_C6/firmware.bin build_output/micropython-esp32c6-twt.bin

    # 8. Upload the verified binary file to the GitHub Actions workflow storage
    - name: Upload compiled firmware artifact
      uses: actions/upload-artifact@v4
      with:
        name: micropython-esp32c6-twt-firmware
        path: build_output/micropython-esp32c6-twt.bin
        if-no-files-found: error
        retention-days: 30
